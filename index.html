<!doctype html>
<!--This tells browser: this is a HTML5 webpage-->
<html lang="en">
  <!--this page is in English-->
  <head>
    <!--head contains infomation about the page-->
    <meta charset="UTF-8" />
    <!--this tells what characters are allowed-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--this helps the webcite work on phones-->
    <title>Todo App</title>
    <!--this is the top tab title-->

    <link rel="stylesheet" href="style.css" />
    <!--this connects HTML and CSS-->
  </head>
  <body>
    <!--this is what appears on the screen-->
    <h1>Todo List</h1>
    <div id="inputArea">
      <!--h1 means heading level 1(largest title)-->
      <input type="text" id="taskInput" placeholder="Enter a task" />
      <!--text input box-->
      <button id="addButton">Add</button>
    </div>
    <!--Add button-->
    <ul id="taskList"></ul>
    <!--task container-->

    <script src="script.js"></script>
    <!--this connects HTML and JavaScript-->
  </body>
</html>
